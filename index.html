
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#0d1117">
    <title>UserArham</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                Helvetica, Arial, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .profile-card {
            background-color: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 40px 20px;
            width: 100%;
            max-width: 380px;
            text-align: center;
            box-shadow: 0 8px 24px rgba(0,0,0,0.2);
        }

        .avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 2px solid #30363d;
            margin: 0 auto 20px;
            display: block;
            object-fit: cover;
        }

        h1 {
            margin: 10px 0 5px;
            color: #f0f6fc;
            font-size: 24px;
        }

        .username {
            color: #8b949e;
            margin-bottom: 20px;
            font-size: 16px;
        }

        .bio {
            font-size: 14px;
            line-height: 1.5;
            margin-bottom: 25px;
            color: #8b949e;
        }

        .section-title {
            color: #f0f6fc;
            font-size: 16px;
            margin: 25px 0 12px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        .btn {
            background-color: #21262d;
            color: #c9d1d9;
            border: 1px solid #30363d;
            padding: 11px 16px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 500;
            display: block;
            transition: 0.2s;
            font-size: 14px;
        }

        .btn:hover {
            background-color: #30363d;
            border-color: #8b949e;
            transform: translateY(-2px);
        }

        .github-btn {
            display: inline-block;
            margin-top: 5px;
        }

        a:focus-visible {
            outline: 2px solid #58a6ff;
            outline-offset: 3px;
        }

        footer {
            color: #6e7681;
            font-size: 12px;
            margin-top: 25px;
        }
    </style>
</head>

<body>

<div class="profile-card">

    <img
        src="https://avatars.githubusercontent.com/u/241672494?v=4"
        alt="Arham Avatar"
        class="avatar"
    >

    <h1>Arham</h1>

    <p class="username">UserArham • he/him</p>

    <div class="bio">
        Founding moderator of <strong>NanoTech Code</strong>.
        NanoTech is an epic coding system built by community moderators.
    </div>

    <h2 class="section-title">My Projects</h2>

    <div class="links">

        <a
            href="https://userarham.github.io/scratch.html"
            class="btn"
            target="_blank"
            rel="noopener noreferrer"
        >
            Scratch 2.0 (Ruffle)
        </a>

        <a
            href="https://userarham.github.io/Eaglerscratch-3.0-Modded"
            class="btn"
            target="_blank"
            rel="noopener noreferrer"
        >
            Scratch 3.0 (Modded)
        </a>

        <a
            href="https://eaglercraft-17w48a.vercel.app"
            class="btn"
            target="_blank"
            rel="noopener noreferrer"
        >
            Eaglercraft 17w48a
        </a>

    </div>

    <a
        href="https://github.com/UserArham"
        class="btn github-btn"
        target="_blank"
        rel="noopener noreferrer"
    >
        View GitHub Profile
    </a>

    <footer>
        © 2026 UserArham
    </footer>

</div>

</body>
</html>
